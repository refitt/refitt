[project]
name = "refitt-server"
version = "0.26.1"
description = "Refitt web server"
readme = "README.rst"
homepage = "https://refitt.org"
documentation = "https://refitt.readthedocs.io"
repository = "https://github.com/refitt/refitt"
authors = [
    { name = "Dan Milisavljevic", email = "dmilisav@purdue.edu" },
    { name = "Niharika Sravan", email = "nsravan@purdue.edu" },
    { name = "Geoffrey Lentner", email = "glentner@purdue.edu" },
    { name = "Mark Linvill", email = "mlinvill@purdue.edu" },
    { name = "Bhagya Subrayan", email = "bsubraya@purdue.edu" },
    { name = "Katie Weil", email = "keweil@purdue.edu" },
    { name = "Josh Church", email = "church10@purdue.edu" },
    { name = "John Banovetz", email = "jbanovet@purdue.edu" },
    { name = "Danielle Dickinson", email = "dickinsd@purdue.edu" }
]
maintainers = [
    { name = "Geoffrey Lentner", email = "glentner@purdue.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.12"
dependencies = [
    "refitt-core",
    "refitt-data",
    "refitt-assets",
    "refitt-api",
    "cmdkit[toml]>=2.7.7",
    "requests>=2.31.0",
    "flask>=3.0.3",
    "gunicorn>=23.0.0",

]

[project.scripts]
refitt-server = "refitt.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refitt"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", ]
markers = [
    "unit: Unit tests are short, interface driven tests on discrete components.",
    "integration: Integration tests are often longer and deal with the interaction between systems.",
    "parameterize: Place holder for parameterized tests (not a real type).",
]
