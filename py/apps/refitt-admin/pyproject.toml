[project]
name = "refitt-admin"
version = "0.26.1"
description = "Admin tools and services"
readme = "README.rst"
homepage = "https://refitt.org"
documentation = "https://refitt.readthedocs.io"
repository = "https://github.com/refitt/refitt"
authors = [
    { name = "Dan Milisavljevic", email = "dmilisav@purdue.edu" },
    { name = "Niharika Sravan", email = "nsravan@purdue.edu" },
    { name = "Geoffrey Lentner", email = "glentner@purdue.edu" },
    { name = "Mark Linvill", email = "mlinvill@purdue.edu" },
    { name = "Bhagya Subrayan", email = "bsubraya@purdue.edu" },
    { name = "Katie Weil", email = "keweil@purdue.edu" },
    { name = "Josh Church", email = "church10@purdue.edu" },
    { name = "John Banovetz", email = "jbanovet@purdue.edu" },
    { name = "Danielle Dickinson", email = "dickinsd@purdue.edu" }
]
maintainers = [
    { name = "Geoffrey Lentner", email = "glentner@purdue.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.12"
dependencies = [
    "refitt-core",
    "refitt-data",
    "refitt-api",
    "refitt-assets",
    "cmdkit[toml]>=2.7.7",
    "numpy>=1.24.3",
    "scipy>=1.10.1",
    "pandas>=2.0.2",
#h5py = "^3.8.0"
#pyarrow = "^14.0.1"
#tensorflow = {version = "^2.13.0,<2.14.0", platform = "linux"}
#tensorflow-macos = {version = "^2.13.0,<2.14.0", platform = "darwin"}
#tensorflow-io-gcs-filesystem = "^0.34.0"
#sqlalchemy = "^2.0.32"
#psycopg2 = {version = "^2.9.6", platform = "linux"}
#psycopg2-binary = {version = "^2.9.6", platform = "darwin"}
#cryptography = "^41.0.1"
#names-generator = "^0.2.0"
#astropy = "^6.0.0"
]

[project.scripts]
refitt = "refitt.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refitt"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", ]
markers = [
    "unit: Unit tests are short, interface driven tests on discrete components.",
    "integration: Integration tests are often longer and deal with the interaction between systems.",
    "parameterize: Place holder for parameterized tests (not a real type).",
]
