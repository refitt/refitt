name: Publish Image

# Build and publish the container image to the GitHub Container Registry (ghcr.io) on every
# release. This is the amd64-first cut: a single native build+push with metadata-action tags.
#
# FOLLOW-UPS (structure left ready, deliberately deferred — see spec/ci-devops-modernization):
#   * arm64: add a native-runner matrix (ubuntu-24.04 + ubuntu-24.04-arm), push-by-digest, then a
#     `docker buildx imagetools create` merge job — only once arm64 native-dep wheels/libs are
#     confirmed (psycopg2, confluent-kafka/librdkafka).
#   * supply-chain: cosign keyless signing + SLSA build-provenance attestation on the final index.

on:
  release:
    types: [published]          # matches publish.yml (fires for stable + prereleases + draft->publish)
  workflow_dispatch:            # manual run (publishes only sha-<short> from a branch)
  pull_request:                 # build-only guardrail: prove the image still builds before release
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - pyproject.toml
      - uv.lock

# Least privilege by default; the push job elevates its own scope below.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}    # refitt/refitt (already lowercase)

concurrency:
  group: docker-${{ github.ref }}
  # Never interrupt an in-flight release push; do cancel superseded PR builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------------------
  # PR guardrail: build without pushing, so a broken Dockerfile fails at PR time, not release.
  # ---------------------------------------------------------------------------------------
  validate:
    name: Validate build (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------------------
  # Release/dispatch: build and push the image to ghcr.io with pep440 + sha tags.
  # ---------------------------------------------------------------------------------------
  build:
    name: Build & push to ghcr.io
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write             # push image to ghcr via GITHUB_TOKEN
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # `latest`/{{major}}/{{major}}.{{minor}} are suppressed for PEP 440 prereleases, so a
      # prerelease publishes only under {{version}} + sha-<short>. type=pep440 (not semver)
      # parses the non-hyphenated Python version string.
      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=sha

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
